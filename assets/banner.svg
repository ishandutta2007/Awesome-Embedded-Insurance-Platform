<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic CSS Animations -->
    <style>
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-15px) scale(1.15); opacity: 0.8; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes waveMotion {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }

      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
      .pulse-bg { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .flow-line { stroke-dasharray: 12, 12; animation: dashFlow 8s linear infinite; }
      .wave-element { animation: waveMotion 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="340" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1000" height="340" fill="url(#grid)" />
  </g>

  <!-- Background Dynamic Glowing Orbs -->
  <circle class="pulse-bg" cx="150" cy="80" r="140" fill="#3B82F6" opacity="0.25" filter="url(#glow)" />
  <circle class="pulse-bg" cx="850" cy="260" r="160" fill="#8B5CF6" opacity="0.2" filter="url(#glow)" />
  <circle class="pulse-bg" cx="500" cy="170" r="110" fill="#EC4899" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Network / Flow Lines (Background Decoration) -->
  <g class="wave-element" opacity="0.35">
    <path d="M 50 280 Q 250 220 500 270 T 950 240" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" class="flow-line" />
    <path d="M 50 300 Q 300 240 600 290 T 950 270" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" class="flow-line" />
  </g>

  <!-- Dynamic Floating Decorative Tech Cards / Badges (Kept in lower/background depth) -->
  <g class="particle-1" opacity="0.5">
    <rect x="70" y="40" width="130" height="34" rx="8" fill="url(#cardGrad)" stroke="#3B82F6" stroke-width="1" />
    <text x="135" y="62" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ API-First</text>
  </g>

  <g class="particle-2" opacity="0.5">
    <rect x="800" y="45" width="140" height="34" rx="8" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1" />
    <text x="870" y="67" fill="#C4B5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ White-Label</text>
  </g>

  <g class="particle-3" opacity="0.5">
    <rect x="760" y="250" width="150" height="34" rx="8" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1" />
    <text x="835" y="272" fill="#F472B6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔓 Open-Source</text>
  </g>

  <!-- Central Shield Icon Accent -->
  <g transform="translate(500, 75)" text-anchor="middle">
    <path d="M 0 -22 L 20 -10 L 20 12 Q 0 28 -20 12 L -20 -10 Z" fill="url(#cyanGrad)" opacity="0.85" filter="url(#softGlow)" />
    <path d="M -8 -2 L -2 4 L 8 -6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND TEXT CONTENT (Guaranteed high visibility and foreground placement) -->
  <!-- Main Title -->
  <text x="500" y="165" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    <tspan fill="url(#primaryGrad)" filter="url(#softGlow)">Awesome Embedded Insurance Platform</tspan>
  </text>

  <!-- Subtitle -->
  <text x="500" y="205" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0.2">
    Curated SaaS Infrastructure &amp; Open-Source Ecosystem for API-First Insurance Distribution
  </text>

  <!-- Bottom Tagline Pill -->
  <g transform="translate(500, 248)">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="0" y="5" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      Point-of-Sale Integration • Policy Admin • Insurtech APIs
    </text>
  </g>

</svg>
